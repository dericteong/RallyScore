<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(120% 140% at 82% 20%, #1b2a4a 0%, #10131c 55%, #0a0c12 100%);
    color: #fff;
    position: relative;
  }
  /* subtle court lines */
  .court {
    position: absolute; inset: 0;
    background:
      linear-gradient(to right, rgba(255,255,255,.04) 1px, transparent 1px) 0 0/ 128px 100%,
      linear-gradient(to bottom, rgba(255,255,255,.04) 1px, transparent 1px) 0 0/ 100% 100px;
    opacity: .6;
  }
  .wrap { position: relative; height: 100%; display: flex; align-items: center; padding: 0 64px; }
  .left { flex: 1; }
  .brandrow { display: flex; align-items: center; gap: 22px; margin-bottom: 18px; }
  .ball {
    width: 92px; height: 92px; border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #d7f36b 0%, #b6e02f 55%, #8fbd18 100%);
    position: relative; box-shadow: 0 8px 26px rgba(0,0,0,.45);
    flex: 0 0 auto;
  }
  .ball i {
    position: absolute; width: 11px; height: 11px; border-radius: 50%;
    background: #0f1420;
  }
  .h1 { top: 22px; left: 30px; } .h2 { top: 20px; left: 55px; }
  .h3 { top: 42px; left: 20px; } .h4 { top: 44px; left: 45px; } .h5 { top: 42px; left: 68px; }
  .h6 { top: 64px; left: 34px; } .h7 { top: 64px; left: 58px; }
  .wordmark { font-size: 68px; font-weight: 800; letter-spacing: -1.5px; line-height: 1; }
  .tagline { font-size: 30px; font-weight: 700; color: #b6e02f; margin: 8px 0 20px; letter-spacing: .5px; }
  .subtitle { font-size: 22px; font-weight: 500; color: #c7cede; max-width: 520px; line-height: 1.35; }
  .chips { display: flex; gap: 12px; margin-top: 26px; }
  .chip {
    font-size: 15px; font-weight: 700; letter-spacing: .6px;
    padding: 9px 16px; border-radius: 999px; background: #1b2233; color: #dfe5f2;
    display: flex; align-items: center; gap: 8px; border: 1px solid #2b3450;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #f2c53d; }
  /* scoreboard card on the right */
  .board {
    flex: 0 0 auto; width: 300px; margin-left: 40px;
    background: #14171f; border: 1px solid #262c3b; border-radius: 22px;
    padding: 26px 22px; box-shadow: 0 18px 50px rgba(0,0,0,.5);
  }
  .score { font-size: 74px; font-weight: 800; text-align: center; letter-spacing: 2px; }
  .row { display: flex; align-items: center; margin-top: 12px; border-radius: 12px; overflow: hidden; }
  .team { flex: 1; padding: 12px 16px; font-size: 22px; font-weight: 800; letter-spacing: .5px; }
  .num { width: 62px; text-align: center; font-size: 30px; font-weight: 800; }
  .blue { background: #1558b0; } .green { background: #157a3b; }
</style>
</head>
<body>
  <div class="court"></div>
  <div class="wrap">
    <div class="left">
      <div class="brandrow">
        <div class="ball">
          <i class="h1"></i><i class="h2"></i><i class="h3"></i><i class="h4"></i>
          <i class="h5"></i><i class="h6"></i><i class="h7"></i>
        </div>
        <div class="wordmark">PickleCast</div>
      </div>
      <div class="tagline">Wear. Play. Score.</div>
      <div class="subtitle">Pickleball scoreboard for your watch, phone &amp; tablet — score every rally, hands-free.</div>
      <div class="chips">
        <div class="chip"><span class="dot"></span>WATCH</div>
        <div class="chip"><span class="dot"></span>PHONE</div>
        <div class="chip"><span class="dot"></span>TABLET</div>
      </div>
    </div>
    <div class="board">
      <div class="score">6&nbsp;·&nbsp;4&nbsp;·&nbsp;2</div>
      <div class="row blue"><div class="team">MY TEAM</div><div class="num">6</div></div>
      <div class="row green"><div class="team">OPPONENT</div><div class="num">4</div></div>
    </div>
  </div>
</body>
</html>
